[theme]
base = "light"
primaryColor = "#0F7A43"
backgroundColor = "#F6F8F3"
secondaryBackgroundColor = "#EDF2E8"
textColor = "#14211A"
linkColor = "#0F7A43"
borderColor = "#DCE5D5"
showWidgetBorder = true
baseRadius = "14px"
buttonRadius = "999px"
font = "'Plus Jakarta Sans':https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
headingFontWeights = [800, 750, 700, 700, 600, 600]
metricValueFontWeight = 700
paddingTop = "2.5rem"
greenColor = "#0F7A43"
chartCategoricalColors = ["#0F7A43", "#7FB800", "#D97706", "#7C3AED", "#C2410C"]
dataframeHeaderBackgroundColor = "#EDF2E8"
dataframeBorderColor = "#DCE5D5"

[client]
toolbarMode = "minimal"
